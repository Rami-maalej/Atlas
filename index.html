<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — 500 Command Test Suite</title>
<style>
  :root{
    --bg:#080b12; --panel:#111726; --panel2:#161d30; --line:#242c44;
    --ink:#e6ecff; --muted:#8b96bb; --accent:#6fe3ff; --accent2:#48d6b5;
    --pass:#3ddc97; --fail:#ff6b7a; --warn:#ffc857;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1200px;margin:auto;padding:26px 20px 70px}
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
    justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(circle,#6fe3ff55,#6fe3ff11);border:2px solid var(--accent);
    font-weight:800;font-size:13px;color:var(--accent);box-shadow:0 0 22px #6fe3ff44}
  h1{font-size:24px;margin:0;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;min-width:80px;text-align:center}
  .stat b{display:block;font-size:20px;line-height:1.2}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}
  .stat.pass b{color:var(--pass)} .stat.fail b{color:var(--fail)} .stat.rate b{color:var(--accent2)}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 12px}
  input[type=search],select,button{font:inherit;color:var(--ink)}
  input[type=search]{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:11px 14px;outline:none}
  input[type=search]:focus{border-color:var(--accent)}
  select,button.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;cursor:pointer}
  button.btn:hover,select:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04141a;font-weight:700}
  .cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);
    padding:6px 11px;border-radius:999px;cursor:pointer;font-size:12.5px;white-space:nowrap}
  .chip:hover{color:var(--ink);border-color:var(--accent)}
  .chip.on{background:var(--accent);color:#04141a;border-color:var(--accent);font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:14px 15px;display:flex;flex-direction:column;gap:10px}
  .card.passed{border-color:#3ddc9766;background:linear-gradient(180deg,#3ddc970e,var(--panel))}
  .card.failed{border-color:#ff6b7a66;background:linear-gradient(180deg,#ff6b7a0e,var(--panel))}
  .top{display:flex;gap:9px;align-items:center}
  .num{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:34px}
  .tag{font-size:10.5px;color:var(--accent);background:#6fe3ff18;border:1px solid #6fe3ff33;
    padding:2px 8px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
  .q{font-size:14.5px;line-height:1.45;flex:1;word-break:break-word}
  .actions{display:flex;gap:7px;flex-wrap:wrap}
  .actions button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;
    padding:6px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
  .actions button:hover{color:var(--ink);border-color:var(--accent)}
  .actions button.ok.on{color:#04150d;background:var(--pass);border-color:var(--pass)}
  .actions button.no.on{color:#1a0508;background:var(--fail);border-color:var(--fail)}
  .actions button.report{border-color:#ffc85766;color:var(--warn)}
  .bugbox{display:none;margin-top:8px;padding:10px;background:#0b0f1a;border:1px solid var(--warn);
    border-radius:8px}
  .card.failed .bugbox{display:block}
  .bugbox label{font-size:11px;color:var(--warn);display:block;margin-bottom:5px}
  .bugbox textarea{width:100%;min-height:54px;background:#050810;color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:7px;font:12px/1.4 monospace;resize:vertical}
  .bugbox .row{display:flex;gap:7px;margin-top:7px}
  .bugbox .row button{flex:1;font-size:11px;padding:6px;background:var(--panel2);
    border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer}
  .bugbox .row button:hover{border-color:var(--accent);color:var(--ink)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--accent);color:var(--ink);padding:10px 18px;
    border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:99;font-size:13px}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
  @media(max-width:640px){.grid{grid-template-columns:1fr}.stats{width:100%}.stat{flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark">J</div><div>
      <h1>JARVIS — 500 Command Test Suite</h1>
      <div class="sub">20 categories · 500 real commands to test the assistant · mark FAIL and copy a ready-made opencode bug report</div>
    </div></div>
    <div class="stats">
      <div class="stat"><b id="s-total">500</b><span>Commands</span></div>
      <div class="stat"><b id="s-tested">0</b><span>Tested</span></div>
      <div class="stat pass"><b id="s-pass">0</b><span>Pass</span></div>
      <div class="stat fail"><b id="s-fail">0</b><span>Fail</span></div>
      <div class="stat rate"><b id="s-rate">—</b><span>Pass rate</span></div>
    </div>
  </header>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Search all 500 commands…">
    <select id="status">
      <option value="all">All statuses</option>
      <option value="untested">Untested</option>
      <option value="pass">Pass</option>
      <option value="fail">Fail</option>
    </select>
    <button class="btn" id="random">Random untested</button>
    <button class="btn" id="fails">Export FAIL reports</button>
    <button class="btn" id="export">Export results</button>
    <button class="btn" id="reset">Reset progress</button>
  </div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="toast"></div>

const CATS = [...new Set(DATA.map(d => d.cat))];
let state = {};
try { state = JSON.parse(localStorage.getItem('jarvis500') || '{}') || {}; } catch(e){ state = {}; }
let cat = 'All', status = 'all', query = '';

const $ = id => document.getElementById(id);
function save(){ localStorage.setItem('jarvis500', JSON.stringify(state)); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600); }
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function report(id){
  const d = DATA[id-1];
  const rec = state[id] || {};
  const note = (typeof rec === 'object' ? rec.note : '') || '';
  return [
    'BUG REPORT FOR OPENCODE — JARVIS TEST SUITE',
    '',
    'Command tested : ' + d.q,
    'Category       : ' + d.cat,
    'Test ID        : #' + String(d.id).padStart(3,'0'),
    'Result         : FAIL',
    '',
    'What happened  : ' + (note || '[describe what Jarvis did, or paste its reply]'),
    'Expected       : Jarvis should understand and execute this command (or give a clear reply).',
    '',
    'Please investigate the relevant intent/action in actions/ and core/, fix the root cause,',
    'then run the relevant tests so this command passes:',
    '  .venv/bin/pytest -m "not network and not slow and not qt" -q',
  ].join('\n');
}

function renderCats(){
  const all = ['All', ...CATS];
  $('cats').innerHTML = all.map(c => {
    const n = c==='All' ? DATA.length : DATA.filter(d=>d.cat===c).length;
    return `<button class="chip ${c===cat?'on':''}" data-c="${c}">${c} <span style="opacity:.6">(${n})</span></button>`;
  }).join('');
  $('cats').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderCats();render();});
}

function statusOf(id){ const v=state[id]; return (typeof v==='object' ? v.s : v) || 'untested'; }
function noteOf(id){ const v=state[id]; return (typeof v==='object' ? v.note : '') || ''; }
function setStatus(id,s){
  const note = noteOf(id);
  if(statusOf(id)===s) delete state[id]; else state[id]={s,note};
  save(); render(); stats();
}
function setNote(id,note){
  const s=statusOf(id);
  state[id]={s,note};
  save(); stats();
}

function render(){
  const q = query.toLowerCase();
  const list = DATA.filter(d =>
    (cat==='All'||d.cat===cat) &&
    (status==='all'||statusOf(d.id)===status) &&
    (!q || d.q.toLowerCase().includes(q) || d.cat.toLowerCase().includes(q))
  );
  $('grid').innerHTML = list.length ? list.map(d=>{
    const s = statusOf(d.id);
    return `<div class="card ${s==='pass'?'passed':s==='fail'?'failed':''}" data-id="${d.id}">
      <div class="top"><span class="num">#${String(d.id).padStart(3,'0')}</span><span class="tag">${d.cat}</span></div>
      <div class="q">"${escapeHtml(d.q)}"</div>
      <div class="actions">
        <button class="ok ${s==='pass'?'on':''}" data-a="pass">PASS</button>
        <button class="no ${s==='fail'?'on':''}" data-a="fail">FAIL</button>
        <button class="report" data-a="report">COPY BUG REPORT</button>
        <button class="cp" data-a="copy">COPY</button>
      </div>
      <div class="bugbox">
        <label>What did Jarvis actually do? (goes into the opencode report)</label>
        <textarea data-note="${d.id}" placeholder="e.g. said it cannot do that / opened the wrong app / no response">${escapeHtml(noteOf(d.id))}</textarea>
        <div class="row">
          <button data-a="report">COPY REPORT FOR OPENCODE</button>
          <button data-a="copyreport">COPY ALL FAIL REPORTS</button>
        </div>
      </div>
    </div>`;
  }).join('') : '<div class="empty">No commands match these filters.</div>';
  $('grid').querySelectorAll('.card').forEach(card=>{
    const id = +card.dataset.id;
    const ta = card.querySelector('textarea[data-note]');
    if(ta) ta.oninput = ()=>setNote(id, ta.value);
    card.querySelectorAll('button').forEach(b=>{
      const a=b.dataset.a;
      if(a==='copy') b.onclick=()=>copy(DATA[id-1].q);
      else if(a==='report') b.onclick=()=>copy(report(id));
      else if(a==='copyreport') b.onclick=()=>copy(failReports());
      else b.onclick=()=>setStatus(id,a);
    });
    card.querySelector('.q').ondblclick=()=>copy(DATA[id-1].q);
  });
}
function failReports(){
  const fails = DATA.filter(d=>statusOf(d.id)==='fail');
  if(!fails.length){ toast('No failed commands yet'); return ''; }
  return fails.map(d=>report(d.id)).join('\n\n' + '='.repeat(70) + '\n\n');
}
function copy(text){
  if(!text){toast('Nothing to copy');return;}
  if(navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>fallback(text));
  else fallback(text);
}
function fallback(text){ const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Copy failed')}ta.remove(); }

function stats(){
  const vals = Object.values(state).map(v=> typeof v==='object'?v.s:v);
  const pass = vals.filter(s=>s==='pass').length, fail = vals.filter(s=>s==='fail').length;
  $('s-tested').textContent = pass+fail;
  $('s-pass').textContent = pass;
  $('s-fail').textContent = fail;
  $('s-rate').textContent = pass+fail ? Math.round(pass/(pass+fail)*100)+'%' : '—';
}

$('search').oninput = e=>{query=e.target.value;render();};
$('status').onchange = e=>{status=e.target.value;render();};
$('reset').onclick = ()=>{ if(confirm('Reset all results and notes?')){state={};save();render();stats();toast('Progress reset');} };
$('fails').onclick = ()=>copy(failReports());
$('export').onclick = ()=>{
  const rows = DATA.map(d=>({id:d.id,category:d.cat,command:d.q,result:statusOf(d.id),note:noteOf(d.id)}));
  const blob = new Blob([JSON.stringify(rows,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='jarvis-500-results.json';a.click();URL.revokeObjectURL(a.href);
  toast('Results exported');
};
$('random').onclick = ()=>{
  const pool = DATA.filter(d=>!state[d.id]);
  if(!pool.length){toast('All commands tested!');return;}
  const d = pool[Math.floor(Math.random()*pool.length)];
  cat='All'; status='all'; query=''; $('search').value=''; $('status').value='all';
  renderCats(); render();
  const el = document.querySelector(`.card[data-id="${d.id}"]`);
  if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.boxShadow='0 0 0 2px var(--accent)';setTimeout(()=>el.style.boxShadow='',1800);}
  copy(d.q);
};

renderCats(); render(); stats();
</script>
