<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestLab — Test Case Manager</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <span class="brand-mark">TL</span>
        <div>
          <h1>TestLab</h1>
          <p class="tagline">Lightweight test case manager</p>
        </div>
      </div>
      <div id="stats" class="stats" aria-live="polite"></div>
    </div>
  </header>

  <main class="container">
    <div id="error" class="error-banner hidden" role="alert"></div>

    <section class="panel">
      <h2 id="form-title">New test case</h2>
      <form id="test-form">
        <input type="hidden" id="test-id">
        <div class="form-row">
          <label for="title">Title *</label>
          <input id="title" name="title" type="text" required maxlength="200"
                 placeholder="e.g. Login with valid credentials">
        </div>
        <div class="form-row">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="2" maxlength="2000"
                    placeholder="What does this test verify?"></textarea>
        </div>
        <div class="form-row">
          <label for="steps">Steps</label>
          <textarea id="steps" name="steps" rows="3" maxlength="5000"
                    placeholder="1. Go to /login&#10;2. Enter valid credentials&#10;3. Submit the form"></textarea>
        </div>
        <div class="form-row-split">
          <div class="form-row">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-row">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="draft" selected>Draft</option>
              <option value="pass">Pass</option>
              <option value="fail">Fail</option>
              <option value="blocked">Blocked</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Add test case</button>
          <button type="button" class="btn hidden" id="cancel-edit">Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="list-header">
        <h2>Test cases</h2>
        <div class="filters">
          <input id="filter-q" type="search" placeholder="Search title or description" aria-label="Search">
          <select id="filter-status" aria-label="Filter by status">
            <option value="">All statuses</option>
            <option value="draft">Draft</option>
            <option value="pass">Pass</option>
            <option value="fail">Fail</option>
            <option value="blocked">Blocked</option>
          </select>
        </div>
      </div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <footer class="footer container">
    <p>TestLab — zero-dependency Node.js app. Data is stored in <code>data/testcases.json</code>.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
