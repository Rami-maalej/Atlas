[project]
name = "taskflow"
version = "1.0.0"
description = "A small full-stack task manager with a FastAPI backend and a vanilla-JS frontend."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
